<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Masa Brava</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* HERO */
.hero {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url("focaccia.jpg") center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;

.logo {

.btn {

    display: inline-block;

.whatsapp {
    background: #25D366;
}

.instagram {
    background: #E1306C;
}

/* SECCIÓN */
.section {
    padding: 50px 20px;
    text-align: center;
}

.card {
    background: #f5f5f5;
    padding: 20px;
    border-radius: 15px;
    max-width: 300px;
    margin: auto;
}

/* GALERÍA */
.galeria img {
    width: 90%;
    max-width: 400px;
    margin: 10px;
    border-radius: 15px;
}

/* FOOTER */
footer {
    background: #111;
    color: white;
    padding: 20px;

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
